[package]
name = "deckweave-platform-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
deckweave-domain.workspace = true
deckweave-platform.workspace = true
directories = "6"
fs2 = "0.4"
serde_json.workspace = true

[target.'cfg(not(windows))'.dependencies]
auto-launch = "0.6"
nix = { version = "0.31.3", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }
windows-registry = "0.6.1"
windows-result = "0.4.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
