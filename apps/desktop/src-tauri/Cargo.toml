[package]
name = "deckweave-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "deckweave-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
deckweave-application.workspace = true
deckweave-automation.workspace = true
deckweave-domain.workspace = true
deckweave-host.workspace = true
deckweave-platform-host.workspace = true
deckweave-plugin-supervisor.workspace = true
deckweave-profiles.workspace = true
deckweave-registry.workspace = true
deckweave-workspace.workspace = true
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.3"
serde_json.workspace = true
tempfile = "3"

[dev-dependencies]
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
smoke-test = []

[lints]
workspace = true
