[package]
name = "deckweave-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
deckweave-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
getrandom = "0.4"
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows-core.workspace = true

[dev-dependencies]
deckweave-application.workspace = true
deckweave-domain.workspace = true
deckweave-platform-host.workspace = true
deckweave-plugin-supervisor.workspace = true
deckweave-registry.workspace = true
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "deckweave-platform-windows-control"
path = "src/bin/control.rs"

[[bin]]
name = "deckweave-platform-windows-input-observe"
path = "src/bin/input_observe.rs"
